services:
  postgres:
    image: postgres:16-alpine
    container_name: plystra-postgres
    environment:
      POSTGRES_DB: plystra
      POSTGRES_USER: plystra
      POSTGRES_PASSWORD: plystra
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plystra -d plystra"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - plystra-postgres-data:/var/lib/postgresql/data

volumes:
  plystra-postgres-data:

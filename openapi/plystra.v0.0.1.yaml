    securitySchemes:
        ApiKeyAuth:
            description: Scoped API key for server-to-server Core calls.
            in: header
            name: X-Plystra-API-Key
            type: apiKey
        BearerAuth:
            bearerFormat: opaque Plystra access token
            description: Use the access_token returned by POST /api/v1/auth/login or POST /api/v1/auth/refresh.
            scheme: bearer
            type: http
        MetricsTokenAuth:
            description: Dedicated metrics token when METRICS_TOKEN or PLYSTRA_METRICS_TOKEN is configured.
            in: header
            name: X-Plystra-Metrics-Token
            type: apiKey
info:
    description: Self-hosted Plystra Core API. Stable surfaces cover identity, authorization, resource registry, audit, admin control-plane, and scoped API keys; plugin, template, and Data Console routes are preview metadata surfaces.
    title: Plystra Core API
    version: 0.0.1
openapi: 3.0.3
paths:
    /api/v1/action-executions:
        get:
            description: Lists Core-owned controlled_action execution ledger rows for a Space without exposing business request payloads.
            operationId: listActionExecutions
            parameters:
                - in: query
                  name: space_id
                  schema:
                    type: string
                - in: query
                  name: capability
                  schema:
                    type: string
                - in: query
                  name: operation
                  schema:
                    type: string
                - in: query
                  name: status
                  schema:
                    type: string
                - in: query
                  name: resource_type
                  schema:
                    type: string
                - in: query
                  name: resource_id
                  schema:
                    type: string
                - in: query
                  name: limit
                  schema:
                    maximum: 200
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiOpenAPIListEnvelopeGithubComPlystraCoreInternalApiOpenAPIActionExecution'
                    description: OK
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiOpenAPIErrorEnvelope'
                    description: Error response.
            security:
                - BearerAuth: []
                - ApiKeyAuth: []
            summary: List Action Gateway executions
            tags:
                - Action Gateway
        post:
            description: Creates or replays a brokered Action Gateway execution for a controlled_action capability operation. Core records authorization and lifecycle metadata; the provider owns business execution.
            operationId: beginActionExecution
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ApiActionExecutionRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiOpenAPIEnvelopeGithubComPlystraCoreInternalApiOpenAPIActionExecution'
                    description: Created
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiOpenAPIErrorEnvelope'
                    description: Error response.
            security:
                - BearerAuth: []
                - ApiKeyAuth: []
            summary: Begin a controlled Action Gateway execution
            tags:
                - Action Gateway
    /api/v1/action-executions/{action_execution_id}:
        get:
            operationId: getActionExecution
            parameters:
                - in: path
                  name: action_execution_id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiOpenAPIEnvelopeGithubComPlystraCoreInternalApiOpenAPIActionExecution'
                    description: OK
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiOpenAPIErrorEnvelope'
                    description: Error response.
            security:
                - BearerAuth: []
                - ApiKeyAuth: []
            summary: Get an Action Gateway execution
            tags:
                - Action Gateway
    /api/v1/action-executions/{action_execution_id}/complete:
        post:
            description: Provider runtimes idempotently report terminal Action Gateway results, including result_unknown for reconciliation.
            operationId: completeActionExecution
            parameters:
                - in: path
                  name: action_execution_id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ApiActionExecutionCompleteRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiOpenAPIEnvelopeGithubComPlystraCoreInternalApiOpenAPIActionExecution'
                    description: OK
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiOpenAPIErrorEnvelope'
                    description: Error response.
            security:
                - BearerAuth: []
                - ApiKeyAuth: []
            summary: Complete a controlled Action Gateway execution
            tags:
                - Action Gateway
    /api/v1/actor/context:
        get:
            operationId: getActorContext
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiOpenAPIEnvelopeGithubComPlystraCoreInternalApiOpenAPIActorContextResponse'
                    description: OK
                default:
                    content:
                        application/json:
                            schema:

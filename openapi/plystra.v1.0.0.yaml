                    description: OK
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiOpenAPIErrorEnvelope'
                    description: Error response.
            security:
                - BearerAuth: []
            summary: Get current actor context
            tags:
                - Actor
    /api/v1/actor/switch-member:
        post:
            operationId: switchMember
            requestBody:
                content:
                    application/json:

    required: true
  - id: authorization.resource
    source: local
    binary: ./system-authz/system-authz
    manifest: ./system-authz/capability.yaml
    required: true
  - id: admin.control_plane
    source: local
    binary: ./system-admin/system-admin
    manifest: ./system-admin/capability.yaml
    required: true
